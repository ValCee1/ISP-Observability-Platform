groups:
  - name: mikrotik-core
    rules:
      - alert: CoreRouterDown
        expr: up{job="snmp-mikrotik"} == 0
        for: 1m
        keep_firing_for: 5m
        labels:
          severity: critical
          category: state
          scope: router
          alert_type: router-down
        annotations:
          summary: "🔴 Core Router DOWN"
          description: "Router {{ $labels.instance }} has been unreachable for 1 minute."

      # FIXED (2026-08-23): this used to also match "ether1", which on the
      # live router was then an unused, permanently-down port - a false
      # positive. FIXED AGAIN (2026-10-06): the follow-up hardcoded
      # ifName="chiemerie-ppp", which went stale when pop1-home's WAN moved
      # to ether1 (2026-09-13) and never covered the other routers at all.
      # The WAN ifName now comes from each router's own `wan_ifname` target
      # label (prometheus/targets/mikrotik-routers.yml): label_replace
      # copies wan_ifname into an ifName label on that router's `up` series,
      # and the `and on (instance, ifName)` join keeps only the interface
      # whose name matches. Adding a router = setting wan_ifname on its
      # target block; no rule edit needed.
      - alert: WANInterfaceDown
        expr: |
          ifOperStatus{job="snmp-mikrotik"} == 2
          and on (instance, ifName)
            label_replace(up{job="snmp-mikrotik"}, "ifName", "$1", "wan_ifname", "(.+)")
        for: 2m
        keep_firing_for: 10m
        labels:
          severity: critical
          category: state
          scope: router
          alert_type: wan-down
        annotations:
          summary: "🔴 WAN Interface DOWN"
          description: "{{ $labels.ifName }} on {{ $labels.instance }} has gone down."

      # REMOVED: WANInterfaceUp (fired continuously whenever the WAN was
      # simply up, re-notifying Telegram every repeat_interval forever -
      # confirmed firing throughout this session). Recovery is already
      # covered for free: WANInterfaceDown's `send_resolved: true` in
      # alertmanager.yml sends a "✅ RESOLVED" message the moment the WAN
      # comes back, without needing a second always-on alert for the
      # steady "everything is fine" state.

      - alert: HighCPU
        expr: hrProcessorLoad > 80
        for: 3m
        labels:
          severity: warning
          category: health
          scope: router
          alert_type: high-cpu
        annotations:
          summary: "🟠 High CPU"
          description: 'CPU on {{ $labels.instance }} has been above 80% for 3 minutes (currently {{ $value | printf "%.1f" }}%).'

      - alert: HighMemory
        expr: 100 * (hrStorageUsed{hrStorageDescr=~".*[Mm]emory.*"} / hrStorageSize{hrStorageDescr=~".*[Mm]emory.*"}) > 75
        for: 3m
        labels:
          severity: warning
          category: health
          scope: router
          alert_type: high-memory
        annotations:
          summary: "🟠 High Memory"
          description: 'Memory on {{ $labels.instance }} has been above 75% for 3 minutes (currently {{ $value | printf "%.1f" }}%).'

      # Router-scoped safety net ONLY: fires if a link radio is ever scraped
      # via the snmp-mikrotik job. FIXED (2026-10-06): this used to match
      # every link_signal_dbm series - i.e. exactly the same series as
      # link-alerts.yml's WeakSignal, with the same alertname and labels
      # but a different threshold (-75/5m vs -80/10m). Alertmanager
      # identifies alerts by their label set, so below -80 dBm the two
      # rules collapsed into one alert with flip-flopping annotations, and
      # between -75 and -80 this one paged on its own. The job filter keeps
      # it to its stated purpose; PTP link signal is link-alerts.yml's job.
      - alert: WeakSignal
        expr: link_signal_dbm{job="snmp-mikrotik"} < -75
        for: 5m
        labels:
          severity: warning
          category: health
          scope: link
          alert_type: weak-signal
        annotations:
          summary: "🟠 Weak Signal"
          description: 'Signal on {{ $labels.instance }} has been below -75 dBm for 5 minutes (currently {{ $value | printf "%.1f" }} dBm).'
