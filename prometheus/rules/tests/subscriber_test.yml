# promtool unit tests for the Tier-1 (RouterOS API) alert logic:
# subscriber mass-outage, POP isolation.
#
# Run:
#   docker run --rm --entrypoint promtool -v "$PWD/prometheus":/p \
#     prom/prometheus:v3.13.2 test rules /p/rules/tests/subscriber_test.yml
#
# Each test loads only the rule file under test and injects the recorded
# series it consumes, so the alert logic is exercised in isolation from the
# recording-rule plumbing (which promtool would otherwise need live scrape
# data for).

rule_files:
  - ../subscriber-alerts.yml
  - ../topology-rollup.yml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------
  # SubscriberMassOutagePOP: >=30% of a POP's sessions gone vs 5m ago
  # (and >=3 absolute). 20 -> 10 at t=5m.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'subscriber:active:by_pop{pop="BASE"}'
        values: '20 20 20 20 20 10 10 10 10 10 10 10'
    alert_rule_test:
      - eval_time: 4m            # drop hasn't happened yet
        alertname: SubscriberMassOutagePOP
        exp_alerts: []
      - eval_time: 9m            # dropped at 5m, held past for: 3m
        alertname: SubscriberMassOutagePOP
        exp_alerts:
          - exp_labels:
              severity: critical
              category: state
              scope: pop
              alert_type: mass-outage-pop
              pop: BASE
            exp_annotations:
              summary: "🔴 Subscriber mass outage at POP BASE"
              description: "POP BASE dropped from 20 to 10 active PPPoE sessions in ~5 min - look for a backhaul, power, or sector RF event before working individual subscribers."

  # A gentle 20 -> 18 dip (10%, only 2 sessions) must NOT page.
  - interval: 1m
    input_series:
      - series: 'subscriber:active:by_pop{pop="BASE"}'
        values: '20 20 20 20 20 18 18 18 18 18 18 18'
    alert_rule_test:
      - eval_time: 9m
        alertname: SubscriberMassOutagePOP
        exp_alerts: []

  # ------------------------------------------------------------------
  # POPIsolated: every backhaul link_up series for the POP is 0.
  # BASE has two backhaul links, two ICMP endpoints each = 4 series.
  # ------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'link_up{link_id="LINK-002", role="Backhaul", pop="BASE", endpoint="a"}'
        values: '1 1 0x18'
      - series: 'link_up{link_id="LINK-002", role="Backhaul", pop="BASE", endpoint="b"}'
        values: '1 1 0x18'
      - series: 'link_up{link_id="LINK003", role="Backhaul", pop="BASE", endpoint="a"}'
        values: '1 1 1 0x17'
      - series: 'link_up{link_id="LINK003", role="Backhaul", pop="BASE", endpoint="b"}'
        values: '1 1 1 0x17'
      - series: 'subscriber:active:by_pop{pop="BASE"}'
        values: '55x25'
    alert_rule_test:
      - eval_time: 2m            # only one link down so far - not isolated
        alertname: POPIsolated
        exp_alerts: []
      - eval_time: 15m           # both backhauls fully down, past for: 3m
        alertname: POPIsolated
        exp_alerts:
          - exp_labels:
              severity: critical
              category: state
              scope: pop
              alert_type: pop-isolated
              pop: BASE
            exp_annotations:
              summary: "🔴 POP BASE isolated - all backhaul down"
              description: "Every backhaul link into POP BASE is unreachable. ~55 subscribers and all sectors behind this POP are affected - this is the root cause; downstream sector / CPE / subscriber alerts for BASE are inhibited."
