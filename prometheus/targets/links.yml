# LINK-001: Tower A ↔ Tower B (AirMAX)
- targets: ["192.168.10.2"]
  labels:
    {
      module: ubiquiti_airmax_link,
      auth: public_v1,
      link_name: litebeam-a,
      link_id: HOME-GSIA,
      endpoint: a,
      site: Home,
      role: P2P,
      vendor: ubiquiti_airmax,
    }
- targets: ["192.168.10.3"]
  labels:
    {
      module: ubiquiti_airmax_link,
      auth: public_v1,
      link_name: litebeam-b,
      link_id: HOME-GSIA,
      endpoint: b,
      site: GSIA,
      role: P2P,
      vendor: ubiquiti_airmax,
    }

