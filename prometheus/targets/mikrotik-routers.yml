# MikroTik core routers scraped by the "snmp-mikrotik" job in
# prometheus.yml, via the generic `mikrotik` SNMP module. One block per
# router; add more `- targets: [...]` entries below as routers are added.
# `site`/`role` are free-form labels attached to every metric from this
# router - used by dashboards to group/filter by location or function.
#
# `router` (added 2026-09-12) is the same stable id used as the `name` in
# routeros_exporter/config.yml for this box. It exists purely so
# Alertmanager can `equal: [router]` a SNMP-side alert (CoreRouterDown,
# keyed by `instance`=IP) against the API-side alert for the same router
# (RouterOSAPICollectorDown, keyed by `router`=this name) - see the
# inhibit_rules note in alertmanager/alertmanager.yml. Not the file
# unification discussed and declined earlier: this is one label, kept in
# sync by hand, not a shared source of truth.
#
# `wan_ifname` is the ifName of this router's real WAN uplink. It IS the
# source of truth (since 2026-10-06) for both the WANInterfaceDown alert
# (prometheus/rules/mikrotik-alerts.yml) and the WAN panels of the WAN/LAN
# Interfaces dashboard - both join ifOperStatus/ifHC*Octets against this
# label via label_replace(up, "ifName", ..., "wan_ifname", ...). Change a
# router's WAN here and the alert + dashboard follow; no rule edit needed.
#
# pop1-home's wan_ifname was "chiemerie-ppp" (CONFIRMED 2026-08-23: ether1
# was an unused/down port then). CONFIRMED CHANGED (2026-09-13, per the
# user): ether1 is the real WAN uplink now - the wiring/config on this
# router genuinely changed. The WAN/LAN Interfaces dashboard's "WAN /
# Backhaul regex" textbox default was updated to match; it's still a
# textbox, adjust it live if this changes again.
- targets:
    - 192.168.10.1
  labels:
    site: "HOME"
    role: "core-router"
    pop: "HOME"
    router: "pop1-home" # keep in sync with routeros_exporter/config.yml `name`
    wan_ifname: "ether1"

- targets:
    - 192.168.10.15
  labels:
    site: "room-office"
    role: "Repeater"
    router: "room-office-repeater" # keep in sync with routeros_exporter/config.yml `name`
    wan_ifname: "wlan1"

- targets:
    - 192.168.11.1
  labels:
    site: "Sam Router"
    role: "sstp"
    router: "Sam OFT"
    wan_ifname: "chidinma-ppp"

- targets:
    - 192.168.11.2
  labels:
    site: "Sam Hotspot"
    role: "Hotspot Router"
    router: "Sam Hotspot"
    wan_ifname: "chidinma-ppp"
