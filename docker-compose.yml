# ISP observability stack: Prometheus scrapes MikroTik routers + PTP link
# radios via SNMP (through snmp-exporter) and checks link reachability via
# ICMP (through blackbox-exporter). Grafana visualizes it, Alertmanager
# routes firing alerts to Telegram. All services share the "monitoring"
# bridge network so they can reach each other by container name.
services:
  # Metrics store + rule/alert evaluation engine. Reads its own config plus
  # the recording/alerting rules and SNMP/ICMP target lists from the repo,
  # all mounted read-only so containers can't modify our source of truth.
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus   # TSDB storage, persisted across restarts
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # Proxies SNMP walks as HTTP scrapes. Prometheus calls it with ?target=
  # and ?module= (see prometheus.yml relabel_configs); it does the actual
  # SNMP GET/WALK against the router or radio and returns Prometheus-format
  # metrics. Module/OID definitions live in snmp_exporter/snmp.yml.
  # SNMPv3 users/passwords are a second config file loaded alongside it
  # (a Docker secret, gitignored - template: snmp_exporter/snmp_auths.example.yml),
  # so v3 credentials never land in git. See docs/snmpv3.md.
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    container_name: snmp-exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
      - "--config.file=/run/secrets/snmp_auths"
    secrets:
      - snmp_auths
    volumes:
      - ./snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "127.0.0.1:9116:9116"   # localhost only - Prometheus uses the Docker network
    networks:
      - monitoring

  # Dashboards. Auto-provisioned from grafana/provisioning (datasource +
  # dashboard folder pointers) and grafana/dashboards (the dashboard JSON
  # itself), so dashboards are version-controlled rather than edited only
  # in the UI. Admin password is injected via a Docker secret, never a
  # plaintext env var.
  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      # Grafana 13 no longer bundles the Prometheus datasource - it's a
      # catalog plugin. Install it synchronously at startup, at a pinned
      # version, and never auto-update it (same rule as every image here).
      - GF_PLUGINS_PREINSTALL_SYNC=prometheus@13.2.3
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # Receives firing/resolved alerts from Prometheus (see the
  # `alerting.alertmanagers` block in prometheus.yml) and forwards them to
  # the NOC Telegram group per alertmanager/alertmanager.yml. Bot token is
  # a Docker secret, kept out of the compose file and git history.
  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - telegram_bot_token
      - deadman_url
    # Public resolvers for the outbound calls (Telegram, the dead-man
    # heartbeat): the LAN/router resolver intermittently fails, which would
    # drop alerts and make the heartbeat look dead. Same fix as
    # whatsapp-bridge; container names still resolve via Docker's own DNS.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "9093:9093"
    networks:
      - monitoring

  # Active reachability probing (ICMP ping) for PTP links, independent of
  # SNMP - this is what still tells you a link is down even if the radio's
  # SNMP agent itself has gone unresponsive. Needs NET_RAW to open raw
  # ICMP sockets inside the container.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    cap_add:
      - NET_RAW   # required for the ICMP prober
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"   # localhost only - Prometheus uses the Docker network
    networks:
      - monitoring

  # Host metrics for the monitoring server itself (CPU, RAM, disk, clock).
  # The host's root filesystem is mounted read-only at /host so disk/mount
  # stats describe the HOST, not the container. On a Linux server you may
  # append `,rslave` to the mount (propagates later host mounts); Docker
  # Desktop rejects it ("not a shared or slave mount"), so it is omitted.
  # On Docker Desktop this reports the Linux VM, not macOS.
  # Alert rules: prometheus/rules/server-health.yml.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      # Container bind-mount artefacts (/etc/hosts, /oldroot...) look like
      # extra, sometimes read-only/0-free filesystems and would trip the
      # disk alerts. Only real data mounts are interesting.
      - "--collector.filesystem.mount-points-exclude=^/(etc|oldroot|run|dev|proc|sys|var/lib/docker|host_mnt)($|/)"
    volumes:
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"   # localhost only - Prometheus uses the Docker network
    networks:
      - monitoring

  # Turns Alertmanager's critical-alert webhooks into WhatsApp Cloud API
  # template messages (see whatsapp_bridge/ and docs/whatsapp.md). SAFE BY
  # DEFAULT: WHATSAPP_MODE=dry_run just logs what would be sent. Settings
  # come from .env (gitignored); the Meta access token is a Docker secret.
  # Hard caps below bound the worst-case monthly spend.
  whatsapp-bridge:
    build:
      context: ./whatsapp_bridge
    image: isp-whatsapp-bridge:dev   # local build tag - not published anywhere
    container_name: whatsapp-bridge
    restart: unless-stopped
    environment:
      - WHATSAPP_MODE=${WHATSAPP_MODE:-dry_run}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_RECIPIENTS=${WHATSAPP_RECIPIENTS:-}
      - WHATSAPP_TEMPLATE=${WHATSAPP_TEMPLATE:-isp_critical_alert}
      - WHATSAPP_DAILY_CAP=${WHATSAPP_DAILY_CAP:-10}
      - WHATSAPP_MONTHLY_CAP=${WHATSAPP_MONTHLY_CAP:-100}
      - WHATSAPP_TZ=${WHATSAPP_TZ:-Africa/Lagos}   # daily/monthly caps roll over at local midnight (site `timezone`)
    # Public resolvers for the outbound call to Meta: the LAN/router resolver
    # intermittently failed to resolve graph.facebook.com from containers.
    # Container-to-container names still use Docker's own DNS.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    secrets:
      - whatsapp_access_token
    volumes:
      - whatsapp_bridge_data:/var/lib/whatsapp-bridge   # budget counters survive restarts
    networks:
      - monitoring

  # RouterOS API collector. Covers what SNMP can't: per-subscriber PPP/PPPoE
  # session intelligence (/ppp active + secret + log) and
  # topology auto-discovery (/ip route + neighbour walk). Prometheus scrapes
  # it on :9436 (job "routeros-api"). Read-only RouterOS user only - see
  # routeros_exporter/README.md. The router list + labels are a bind-mounted
  # config file; the API passwords are a Docker secret keyed by router name,
  # never in the config file or git.
  routeros-exporter:
    build:
      context: ./routeros_exporter
    image: isp-routeros-exporter:dev   # local build tag - not published anywhere
    container_name: routeros-exporter
    restart: unless-stopped
    volumes:
      - ./routeros_exporter/config.yml:/etc/routeros-exporter/config.yml:ro
      - routeros_exporter_data:/var/lib/routeros-exporter
    secrets:
      - routeros_api_credentials
    ports:
      - "127.0.0.1:9436:9436"   # localhost only - Prometheus uses the Docker network
    networks:
      - monitoring

# Docker secrets: mounted into containers as read-only files under
# /run/secrets/<name>, never as environment variables. Fill these files in
# locally before `docker compose up` - all are gitignored.
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  routeros_api_credentials:
    file: ./secrets/routeros_api_credentials.json
  # Meta WhatsApp Cloud API token. Any placeholder text works while the
  # bridge is in dry_run; the file must exist or `docker compose up` fails.
  whatsapp_access_token:
    file: ./secrets/whatsapp_access_token.txt
  # SNMPv3 credentials (auths: only). `auths: {}` is a valid empty file
  # when every device is still on v2c.
  snmp_auths:
    file: ./secrets/snmp_auths.yml
  # Dead-man's switch ping URL (e.g. a healthchecks.io check). Unused until
  # the Watchdog route in alertmanager.yml is switched on - docs/deadman.md.
  deadman_url:
    file: ./secrets/deadman_url.txt

# Named volumes persist container state across `docker compose down`/`up`.
# Only removed by an explicit `docker compose down -v`.
volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  routeros_exporter_data:   # generated topology file
  whatsapp_bridge_data:     # WhatsApp daily/monthly message counters

networks:
  monitoring:
    driver: bridge