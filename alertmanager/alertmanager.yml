global:
  resolve_timeout: 5m

# Named time windows referenced by `active_time_intervals` on routes below.
# `morning-0800-lagos` is the daily delivery window for the sector capacity
# digest: the underlying alerts (SectorOverClientCapacity /
# SectorOverThroughputBudget) fire in Prometheus whenever a sector is over
# budget, but Alertmanager only releases them to Telegram between 08:00 and
# 08:15 Africa/Lagos, once per day (repeat_interval 24h), batched into one
# message.
time_intervals:
  - name: morning-0800-lagos
    time_intervals:
      - location: "Africa/Lagos"
        times:
          - start_time: "08:00"
            end_time: "08:15"

# REWRITTEN (2026-08-23) to stop Telegram spam. The old config had one flat
# route grouping by {alertname, instance}, which meant a single real event
# (e.g. a link dropping) could fire LinkDown + WeakSignal + RisingInterfaceErrors
# as three SEPARATE alertname groups -> three separate Telegram messages for
# one problem. It also had no inhibition, so once a link/router is fully
# down, its now-stale health/degrading alerts could still notify separately
# instead of being suppressed by the more useful "it's down" alert.
#
# Fix has two parts:
#   1. Route tree below groups every alert about the same *entity* (one PTP
#      link, or one router) into a single notification, and gives critical
#      alerts a shorter repeat_interval than warnings so paging cadence
#      matches severity instead of one blanket 3h for everything.
#   2. inhibit_rules (bottom of file) suppress the alerts that are just
#      symptoms of a bigger one already firing for the same entity - e.g.
#      once LinkDown is firing for a link, its WeakSignal/RisingInterfaceErrors
#      alerts (which are actively noisy right as a link drops, per the
#      live testing on 2026-08-23) go silent until LinkDown resolves.
route:
  receiver: telegram
  group_by: ["alertname"]   # only used if nothing below matches (shouldn't happen - every alert carries `instance`)
  group_wait: 45s
  group_interval: 10m
  repeat_interval: 6h

  routes:
    # Sector capacity alerts (category: capacity, from sector-alerts.yml):
    # held back and delivered as a single once-a-day digest in the 08:00
    # Africa/Lagos window. group_by alertname so every over-budget sector
    # lands in one message; repeat_interval 24h so it's genuinely daily.
    # MUST come before the `sector` route below (capacity alerts also carry
    # a `sector` label and would otherwise match that first).
    - match:
        category: capacity
      group_by: ["alertname"]
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 24h
      active_time_intervals:
        - morning-0800-lagos

    # All other sector alerts (state + health, from sector-alerts.yml) carry
    # a `sector` label. Group by it so SectorDown + its CPE symptom alerts
    # for the same sector arrive as one real-time message.
    - match_re:
        sector: ".+"
      group_by: ["sector"]
      group_wait: 45s
      group_interval: 10m
      routes:
        - match:
            severity: critical
          repeat_interval: 2h
        - match:
            severity: warning
          repeat_interval: 12h

    # PTP link alerts (link-alerts.yml) all carry a link_id label shared by
    # both endpoints of the same physical link. Grouping by link_id (NOT
    # instance, which differs per endpoint) means LinkDown + WeakSignal +
    # RisingInterfaceErrors for the two ends of one link land in ONE
    # Telegram message instead of up to six.
    - match_re:
        link_id: ".+"
      group_by: ["link_id"]
      group_wait: 45s
      group_interval: 10m
      routes:
        - match:
            severity: critical
          repeat_interval: 2h    # a link actually down - keep reminding until it's fixed
        - match:
            severity: warning
          repeat_interval: 12h   # degraded-but-up - don't need frequent nagging

    # Everything else (router-level alerts from mikrotik-alerts.yml - no
    # link_id) groups by instance instead, so CoreRouterDown + HighCPU +
    # HighMemory for the same router land in one message too.
    - match_re:
        instance: ".+"
      group_by: ["instance"]
      group_wait: 45s
      group_interval: 10m
      routes:
        - match:
            severity: critical
          repeat_interval: 2h
        - match:
            severity: warning
          repeat_interval: 12h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: -1004387943176 # This is the alert group ID
        api_url: https://api.telegram.org
        parse_mode: HTML
        send_resolved: true   # also sends a "resolved" message when the alert clears
        # One Telegram message per notification batch: a header naming the
        # shared entity (link_id or instance - whichever this route grouped
        # on, see `routes` above), then each alert in the batch. A firing
        # alert shows an absolute start time ("since HH:MM:SS") rather than
        # a live-updating "N minutes ago", since a push notification is read
        # after the fact and a baked-in relative time would just go stale.
        # A resolved alert instead shows real elapsed downtime via
        # `.EndsAt.Sub .StartsAt` - time.Time.Sub is a plain Go method
        # (single argument, one return value), so Alertmanager's stock Go
        # text/template can call it directly with no extra template
        # functions or relay service needed for this.
        # One message per object per batch. Header line = a single verdict
        # for the whole object (worst severity + count), then each alert
        # under it. Symptoms of a bigger incident are already gone by the
        # time they'd get here (inhibit_rules below), so the list is the
        # real picture, not a storm.
        message: |
          {{- $obj := "" }}{{ if .CommonLabels.link_id }}{{ $obj = printf "Link %s" .CommonLabels.link_id }}
          {{- else if .CommonLabels.sector }}{{ $obj = printf "Sector %s" .CommonLabels.sector }}
          {{- else if .CommonLabels.instance }}{{ $obj = printf "Router %s" .CommonLabels.instance }}
          {{- else }}{{ $obj = .CommonLabels.alertname }}{{ end }}
          {{- if eq .Status "resolved" }}✅ <b>{{ $obj }} — RESOLVED</b>
          {{- else if eq .CommonLabels.severity "critical" }}🔴 <b>{{ $obj }} — CRITICAL</b> ({{ .Alerts.Firing | len }} alert{{ if gt (len .Alerts.Firing) 1 }}s{{ end }})
          {{- else }}🟠 <b>{{ $obj }} — degraded</b> ({{ .Alerts.Firing | len }} alert{{ if gt (len .Alerts.Firing) 1 }}s{{ end }}){{ end }}

          {{ range .Alerts }}{{ if eq .Status "firing" }}• <b>{{ .Annotations.summary }}</b> (since {{ .StartsAt.Format "15:04 MST" }})
          {{ else }}• ✅ {{ .Annotations.summary }} (was firing {{ .EndsAt.Sub .StartsAt }})
          {{ end }}{{ if .Labels.link_name }}  {{ .Labels.link_name }}: {{ end }}{{ if .Labels.cpe_name }}  {{ .Labels.cpe_name }}: {{ end }}{{ .Annotations.description }}
          {{ end }}

# Suppress lower-priority alerts about an entity that's already covered by
# a bigger, currently-firing alert for that SAME entity (`equal:` is the
# join key - both source and target alert must share that label value).
# This is what actually stops the notification burst a real outage
# produces: instead of getting LinkDown + WeakSignal + RisingInterfaceErrors
# as separate messages, you get LinkDown, and the other two are inhibited
# for as long as LinkDown keeps firing.
inhibit_rules:
  # A link that's fully down doesn't need its degrading/health-tier alerts
  # (WeakSignal, LowLinkQuality, HighLatencyVariability, RisingInterfaceErrors,
  # LinkUpButDegrading) also notifying - they're just noise once you already
  # know it's down.
  - source_match:
      alertname: LinkDown
    target_match_re:
      category: "health|degrading"
    equal: ["link_id"]

  # LinkUpButDegrading is a deliberately-broader "something's wrong while
  # still up" signal (link-alerts.yml) - once it's firing for a link, the
  # narrower single-condition health alerts it was built to summarize
  # (WeakSignal, LowLinkQuality, HighLatencyVariability) are redundant.
  - source_match:
      category: degrading
    target_match:
      category: health
    equal: ["link_id"]

  # PacketLoss and HighLatency (link-alerts.yml) are each defined as two
  # rules sharing one alertname with different thresholds/severity (5%/20%
  # loss, 100ms/500ms latency) - Prometheus evaluates both independently,
  # so a link at 25% loss trips warning AND critical at once. Without this,
  # that's a second Telegram message for the same signal the moment it
  # crosses the higher bar. `equal` includes alertname so this only
  # suppresses a warning of the SAME signal, not unrelated health alerts.
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["link_id", "alertname"]

  # A sector AP that's fully down will also trip every CPE-level symptom
  # alert for that sector (weak signal, low SNR, flapping, rate collapse,
  # congestion) as the registration table goes stale - suppress them, the
  # "sector is down" message is the useful one. `equal: [sector]` scopes it
  # to the same sector.
  - source_match:
      alertname: SectorDown
    target_match_re:
      category: "health|capacity"
    equal: ["sector"]

  # Likewise SectorNoClients (RF up on paper, nobody registered) covers its
  # own downstream CPE/capacity noise.
  - source_match:
      alertname: SectorNoClients
    target_match_re:
      category: "health|capacity"
    equal: ["sector"]

  # A sector's backhaul being down is a state incident that explains the
  # RF/CPE/capacity symptoms that follow.
  - source_match:
      alertname: SectorEther1Down
    target_match_re:
      category: "health|capacity"
    equal: ["sector"]

  # DEPENDENCY AWARENESS (see prometheus/topology.yml). A backhaul link into
  # a POP going down makes every sector/router behind that POP unreachable -
  # their own alerts are downstream noise, not separate incidents. Guarded
  # by `pop=~".+"` so it only fires when the LinkDown actually carries a
  # `pop` label (i.e. you've tagged that link as a POP backhaul in
  # links.yml); otherwise inert.
  - source_match:
      alertname: LinkDown
    source_match_re:
      pop: ".+"
    target_match_re:
      scope: "sector|router"
    equal: ["pop"]

  # Same for a POP's router being down (targets sectors only - a router
  # can't be "downstream" of itself).
  - source_match:
      alertname: CoreRouterDown
    source_match_re:
      pop: ".+"
    target_match:
      scope: "sector"
    equal: ["pop"]

  # STEP 7: when SectorWideCPEDegradation is firing, the individual
  # per-CPE RF alerts on that same sector (weak signal, signal drift,
  # signal rising, chain imbalance, low SNR) are the evidence beneath it,
  # not separate incidents - suppress them. CPEFlapping and CPERateCollapse
  # are deliberately NOT suppressed: they're a different failure mode that
  # can coincide with, but isn't explained by, a sector-wide RF problem.
  - source_match:
      alertname: SectorWideCPEDegradation
    target_match_re:
      alert_type: "cpe-(weak-signal|signal-drift|signal-rising|chain-imbalance|low-snr)"
    equal: ["sector"]

  # A router that's fully unreachable will also trip its own CPU/memory/
  # WAN alerts as soon as SNMP starts timing out on stale data - those add
  # nothing once you already know the whole router is down.
  - source_match:
      alertname: CoreRouterDown
    target_match_re:
      category: "health"
    equal: ["instance"]

  # If the WAN link itself is down, CPU/memory alerts on that router
  # (which may also be affected, e.g. retry storms) aren't the useful
  # signal right now - the WAN outage is.
  - source_match:
      alertname: WANInterfaceDown
    target_match:
      severity: warning
    equal: ["instance"]
