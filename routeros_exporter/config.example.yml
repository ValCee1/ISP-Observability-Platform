# routeros-exporter configuration: the POP routers (`pops.<POP>.router`) -
# the PPPoE servers. Only these are polled over the RouterOS API; client
# routers never are. API logins are in secrets/routeros_api_credentials.json,
# keyed by `name` and written from the vault's routeros_api_logins.

options:
  listen_port: 9436
  poll_interval_seconds: 30
  api_timeout_seconds: 30
  topology_interval_seconds: 900
  topology_output_path: "/var/lib/routeros-exporter/topology.generated.yml"
  log_lookback: 200

routers:
  - name: "pop-ikeja"
    host: "10.50.0.1"
    port: 8728
    site: "Ikeja"
    pop: "IKEJA"
    role: "core-router"
  - name: "pop-yaba"
    host: "10.50.2.1"
    port: 8729
    use_tls: true
    site: "Yaba"
    pop: "YABA"
    role: "core-router"
