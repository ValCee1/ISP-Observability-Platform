[project]
name = "routeros-exporter"
version = "0.1.0"
description = "RouterOS API collector for the ISP Observability Platform"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
