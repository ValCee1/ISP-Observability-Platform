# SNMP exporter config. `auths` are named community/version credential
# sets; `modules` define what OIDs to walk/read and how to name them as
# Prometheus metrics. Prometheus selects an auth + module per-target via
# the `auth`/`module` labels in prometheus/targets/*.yml (see
# prometheus.yml's relabel_configs for how those become the __param_*
# query params the exporter reads).
auths:
  public_v2:
    community: monitoring
    version: 2
  public_v1:
    community: monitoring
    version: 1
  saf_v2:
    community: saf-public
    version: 2

modules:
  # Generic router health module (standard MIB-2/HOST-RESOURCES OIDs, works
  # for any RouterOS device): uptime, per-interface counters/state via
  # IF-MIB, CPU load, and memory/storage usage. Used by the "snmp-mikrotik"
  # job for core routers - see prometheus/targets/mikrotik-routers.yml.
  mikrotik:
    walk:
      - 1.3.6.1.2.1.1 # system
      - 1.3.6.1.2.1.2 # ifTable
      - 1.3.6.1.2.1.31.1.1 # ifXTable
      - 1.3.6.1.2.1.25.3.3.1.2 # hrProcessorLoad
      - 1.3.6.1.2.1.25.2.3.1 # hrStorageTable

    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Time since last reboot (hundredths of a second)

      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: High-capacity inbound octet counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: High-capacity outbound octet counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: Interface operational status (1=up, 2=down)
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: hrProcessorLoad
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        help: CPU load percentage
        indexes:
          - labelname: hrDeviceIndex
            type: gauge

      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Storage size units (memory/disk)
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            oid: 1.3.6.1.2.1.25.2.3.1.3
            labelname: hrStorageDescr
            type: DisplayString

      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Storage units used (memory/disk)
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            oid: 1.3.6.1.2.1.25.2.3.1.3
            labelname: hrStorageDescr
            type: DisplayString

  # Vendor-neutral interface counters/state for PTP link endpoints
  # (standard IF-MIB - same OIDs regardless of radio vendor). Paired with
  # one of the vendor-specific radio modules below for a full picture of a
  # link endpoint. Used by the "link-interface-health" job.
  link_interface_health:
    walk:
      - 1.3.6.1.2.1.1 # system (adds sysUpTime)
      - 1.3.6.1.2.1.2 # ifTable
      - 1.3.6.1.2.1.31.1.1 # ifXTable
      - 1.3.6.1.2.1.2.2.1.14 # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20 # ifOutErrors
    metrics:
      - name: link_uptime_seconds
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        # raw value is hundredths of a second - divide by 100 in a query/recording rule

      - name: link_interface_state
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: link_interface_in_octets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: link_interface_out_octets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: link_interface_in_errors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: link_interface_out_errors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

  # MikroTik PtMP sector AP telemetry, via the proprietary MIKROTIK-MIB
  # wireless subtree (1.3.6.1.4.1.14988.1.1.1) plus standard IF-MIB /
  # HOST-RESOURCES for the sector device itself. Field numbers were decoded
  # from a live snmpwalk of an Nv2 / 802.11ac sector on 2026-08-27 (see
  # prometheus/rules/link-schema-notes.md for the full column map):
  #
  #   .2.1  registration table (one row per associated CPE)
  #         index = <6-byte client MAC>.<wlan ifIndex>
  #         .3 signal  .4/.5 tx/rx bytes  .6/.7 tx/rx pkts  .8/.9 tx/rx PHY
  #         rate (bps)  .11 session uptime  .12 signal-to-noise
  #         .13/.14 tx/rx chain0  .15/.16 tx/rx chain1  .19 tx signal
  #         .20 client name (used as the cpe_name label)
  #   .3.1  AP table (one row per wlan), index = <wlan ifIndex>
  #         .4 ssid  .6 registered clients  .7 freq MHz  .8 channel string
  #         .9 noise floor dBm  .11 authed clients
  #   .4.0  scalar: total registered clients across all wlans
  #
  # CCQ (.3.1.10 / rtab) is deliberately NOT mapped - it reads 0 under Nv2.
  # Only the sector AP is polled; the CPEs need no SNMP of their own since
  # every per-CPE field above comes from the AP's registration table.
  # Used by the "snmp-sectors" job - targets in
  # prometheus/targets/mikrotik-sectors.yml.
  mikrotik_sector:
    walk:
      - 1.3.6.1.2.1.1.3            # sysUpTime
      - 1.3.6.1.2.1.2             # ifTable
      - 1.3.6.1.2.1.31.1.1       # ifXTable (ifName, HC octet counters)
      - 1.3.6.1.2.1.2.2.1.14     # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20     # ifOutErrors
      - 1.3.6.1.2.1.25.3.3.1.2   # hrProcessorLoad
      - 1.3.6.1.2.1.25.2.3.1     # hrStorageTable (memory/disk)
      - 1.3.6.1.2.1.4.22.1.2     # ipNetToMediaPhysAddress (ARP: IP -> MAC), best-effort CPE IP
      - 1.3.6.1.4.1.14988.1.1.1  # MikroTik wireless: rtab + AP table + scalars
    metrics:
      - name: sector_uptime_seconds
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Sector device uptime, hundredths of a second (divide by 100 downstream)

      # --- the sector device's own interfaces: the wlanN carrying RF
      # traffic and ether1 carrying the backhaul. ifName-keyed so dashboards
      # can pick them apart per device. ---
      - name: sector_interface_state
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: sector_interface_speed_mbps
        oid: 1.3.6.1.2.1.31.1.1.1.15   # ifHighSpeed - negotiated port speed in Mbit/s
        type: gauge
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: sector_interface_in_octets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: sector_interface_out_octets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: sector_interface_in_errors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: sector_interface_out_errors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            oid: 1.3.6.1.2.1.31.1.1.1.1
            labelname: ifName
            type: DisplayString

      - name: sector_cpu_load_percent
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        indexes:
          - labelname: hrDeviceIndex
            type: gauge

      - name: sector_storage_size
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            oid: 1.3.6.1.2.1.25.2.3.1.3
            labelname: hrStorageDescr
            type: DisplayString

      - name: sector_storage_used
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            oid: 1.3.6.1.2.1.25.2.3.1.3
            labelname: hrStorageDescr
            type: DisplayString

      # --- per-CPE registration table -----------------------------------
      # index across all of these: cpe_mac (6-octet) + wlan_ifindex.
      # cpe_name comes from column .20 via lookup.
      - name: sector_cpe_signal_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.3
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_tx_bytes
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.4
        type: counter
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_rx_bytes
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.5
        type: counter
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_tx_packets
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.6
        type: counter
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_rx_packets
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.7
        type: counter
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_tx_rate_bps
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.8
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_rx_rate_bps
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.9
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_session_uptime_seconds
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.11
        type: gauge
        help: Time since this CPE last (re)registered, hundredths of a second - resets on a flap
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_snr_db
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.12
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_tx_strength_ch0_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.13
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_rx_strength_ch0_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.14
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_tx_strength_ch1_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.15
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_rx_strength_ch1_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.16
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      - name: sector_cpe_tx_signal_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.19
        type: gauge
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      # Client RouterOS version (rtab col .10) - emitted as
      # sector_cpe_ros_version{sector_cpe_ros_version="6.49.19", cpe_mac=..} 1,
      # useful for spotting CPEs that need a firmware bump.
      - name: sector_cpe_ros_version
        oid: 1.3.6.1.4.1.14988.1.1.1.2.1.10
        type: DisplayString
        indexes:
          - labelname: cpe_mac
            type: PhysAddress48
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [cpe_mac, wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.2.1.20
            labelname: cpe_name
            type: DisplayString

      # Best-effort CPE IP from the sector AP's ARP table (IP-MIB
      # ipNetToMediaPhysAddress). Index is arp_ifindex + cpe_ip; the value
      # is the MAC, emitted into the label `sector_cpe_ip` - prometheus.yml
      # copies that into `cpe_mac` so it joins the registration table.
      # May be empty if the AP is a pure L2 bridge with no L3 neighbours.
      - name: sector_cpe_ip
        oid: 1.3.6.1.2.1.4.22.1.2
        type: PhysAddress48
        indexes:
          - labelname: arp_ifindex
            type: gauge
          - labelname: cpe_ip
            type: InetAddressIPv4

      # --- AP / sector table (index = wlan ifIndex) ---------------------
      - name: sector_registered_clients
        oid: 1.3.6.1.4.1.14988.1.1.1.3.1.6
        type: gauge
        indexes:
          - labelname: wlan_ifindex
            type: gauge
        lookups:
          - labels: [wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.3.1.4
            labelname: ssid
            type: DisplayString
          - labels: [wlan_ifindex]
            oid: 1.3.6.1.4.1.14988.1.1.1.3.1.8
            labelname: channel
            type: DisplayString

      - name: sector_auth_clients
        oid: 1.3.6.1.4.1.14988.1.1.1.3.1.11
        type: gauge
        indexes:
          - labelname: wlan_ifindex
            type: gauge

      - name: sector_frequency_mhz
        oid: 1.3.6.1.4.1.14988.1.1.1.3.1.7
        type: gauge
        indexes:
          - labelname: wlan_ifindex
            type: gauge

      - name: sector_noise_floor_dbm
        oid: 1.3.6.1.4.1.14988.1.1.1.3.1.9
        type: gauge
        indexes:
          - labelname: wlan_ifindex
            type: gauge

      - name: sector_total_registered_clients
        oid: 1.3.6.1.4.1.14988.1.1.1.4.0
        type: gauge
        help: Total CPEs registered across every wlan on this sector device

  # Radio-side health for Ubiquiti airMAX PTP links (LiteBeam, NanoBeam,
  # etc.) - signal, noise, CCQ, channel width, plus airMAX-only extras
  # (quality/capacity %) kept out of the common link_* schema since they
  # have no equivalent on other vendors. Used by the "link-radio-health"
  # job wherever a links.yml target sets module: ubiquiti_airmax_link.
  ubiquiti_airmax_link:
    # ubntWlStatTable: ubntAirMAX(4).ubntWlStatTable(5) -> 1.3.6.1.4.1.41112.1.4.5
    # ubntRadioTable:  ubntAirMAX(4).ubntRadioTable(1)  -> 1.3.6.1.4.1.41112.1.4.1
    # ubntAirMaxTable: ubntAirMAX(4).ubntAirMaxTable(6) -> 1.3.6.1.4.1.41112.1.4.6
    walk:
      - 1.3.6.1.4.1.41112.1.4.5.1 # ubntWlStatEntry
      - 1.3.6.1.4.1.41112.1.4.1.1.4 # ubntRadioFreq
      - 1.3.6.1.4.1.41112.1.4.6.1 # ubntAirMaxEntry
    metrics:
      - name: link_signal_dbm
        oid: 1.3.6.1.4.1.41112.1.4.5.1.5 # ubntWlStatSignal (field 5 in the SEQUENCE)
        type: gauge
        indexes:
          - labelname: wlan_index
            type: gauge

      - name: link_noise_dbm
        oid: 1.3.6.1.4.1.41112.1.4.5.1.8 # ubntWlStatNoiseFloor (field 8)
        type: gauge
        indexes:
          - labelname: wlan_index
            type: gauge

      - name: link_quality_percent
        oid: 1.3.6.1.4.1.41112.1.4.5.1.7 # ubntWlStatCcq (field 7)
        type: gauge
        indexes:
          - labelname: wlan_index
            type: gauge

      - name: link_channel_width_mhz
        oid: 1.3.6.1.4.1.41112.1.4.5.1.14 # ubntWlStatChanWidth (field 14)
        type: gauge
        indexes:
          - labelname: wlan_index
            type: gauge

      - name: link_frequency_mhz
        oid: 1.3.6.1.4.1.41112.1.4.1.1.4 # ubntRadioFreq (separate table, field 4)
        type: gauge
        indexes:
          - labelname: radio_index
            type: gauge

      # airMAX-specific extras - deliberately NOT named link_*, no equivalent
      # on MikroTik/SAF/AirFiber. See link-schema-notes.md for the reasoning.
      - name: ubiquiti_airmax_quality_percent
        oid: 1.3.6.1.4.1.41112.1.4.6.1.3 # ubntAirMaxQuality (field 3)
        type: gauge
        indexes:
          - labelname: radio_index
            type: gauge

      - name: ubiquiti_airmax_capacity_percent
        oid: 1.3.6.1.4.1.41112.1.4.6.1.4 # ubntAirMaxCapacity (field 4)
        type: gauge
        indexes:
          - labelname: radio_index
            type: gauge

  # Radio-side health for Ubiquiti AirFiber PTP backhaul links - rx power,
  # link capacity (already bps, no unit conversion needed), and link state.
  #
  # NOTE: the raw capacity OID is named airfiber_rx_capacity_bps, NOT
  # link_capacity_bps directly - SAF's equivalent OID is in kb/s, not bps
  # (see saf_link below), so the two vendors' raw values aren't
  # comparable. The normalized, vendor-agnostic `link_capacity_bps` is
  # built from both raw metrics in prometheus/rules/link-normalization.yml
  # - query that one, not the vendor-specific raw metrics, from dashboards
  # or alerts.
  ubiquiti_airfiber_link:
    # airFiberStatusEntry: ubntAirFIBER(3).airFiberStatus(2) -> 1.3.6.1.4.1.41112.1.3.2
    walk:
      - 1.3.6.1.4.1.41112.1.3.2.1
    metrics:
      - name: link_signal_dbm
        oid: 1.3.6.1.4.1.41112.1.3.2.1.11 # rxPower0 (field 11)
        type: gauge
        indexes:
          - labelname: radio_index
            type: gauge
      - name: airfiber_rx_capacity_bps
        oid: 1.3.6.1.4.1.41112.1.3.2.1.5 # rxCapacity, bits/sec already (field 5)
        type: gauge
        indexes:
          - labelname: radio_index
            type: gauge
      - name: link_interface_state
        oid: 1.3.6.1.4.1.41112.1.3.2.1.26 # radioLinkState: 0=down, 1=up (field 26)
        type: gauge
        indexes:
          - labelname: radio_index
            type: gauge

  # Radio-side health for SAF Integra PTP backhaul links - rx level, MSE
  # (modem error), capacity, modem acquire status, and port state/octets.
  # MSE and capacity come off the wire in SAF-specific raw units (see the
  # saf_modem_mse_raw / saf_modem_capacity_kbps comments below) and are
  # normalized into the vendor-agnostic link_mse_db / link_capacity_bps in
  # prometheus/rules/link-normalization.yml.
  saf_link:
    walk:
      - 1.3.6.1.4.1.7571.100.1.1.7.1.2 # integraBradio
      - 1.3.6.1.4.1.7571.100.1.1.7.1.3 # integraBmodem
      - 1.3.6.1.4.1.7571.100.1.1.7.1.5.1.1 # integraBifStatusTable (port state)
      - 1.3.6.1.4.1.7571.100.1.1.7.1.5.2.1 # integraBifStatisticsTable (octets)
    metrics:
      - name: link_signal_dbm
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.2.3 # integraBradioRxLevel
        type: gauge

      - name: saf_modem_mse_raw
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.3.2 # integraBmodemRadialMse
        type: gauge
        # MIB note: "floating point value multiplied by 10" (e.g. raw -320
        # means -32.0 dB). Normalized (raw / 10) as link_mse_db in
        # prometheus/rules/link-normalization.yml - query that, not this.

      - name: saf_modem_capacity_kbps
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.3.10 # integraBmodemRxCapacity, kb/s
        type: gauge
        # kb/s, NOT bps - see the airfiber_rx_capacity_bps note above.
        # Normalized (raw * 1000) into the vendor-agnostic
        # link_capacity_bps in prometheus/rules/link-normalization.yml.

      - name: saf_modem_acquire_status
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.3.1 # integraBmodemAcquireStatus: 1=inProgress,2=locked,3=failed
        type: gauge
        # fold into link_interface_state via recording rule: ==2 -> 1, else 0

      - name: link_interface_state
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.5.1.1.8 # integraBifPortOperStatus: 1=up,2=down,3=unknown
        type: gauge
        indexes:
          - labelname: port_index
            type: gauge

      - name: link_interface_in_octets
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.5.2.1.24 # integraBifIfInOctets
        type: counter
        indexes:
          - labelname: port_index
            type: gauge

      - name: link_interface_out_octets
        oid: 1.3.6.1.4.1.7571.100.1.1.7.1.5.2.1.25 # integraBifIfOutOctets
        type: counter
        indexes:
          - labelname: port_index
            type: gauge
