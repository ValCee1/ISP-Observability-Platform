# Per-site settings and secrets for the Ansible deploy - TEMPLATE.
# Never fill this file in. scripts/edit-secrets.sh copies it to
# ansible/secrets.yml, encrypts that, and opens it in your editor; commit the
# encrypted file. Docs: docs/ANSIBLE.md, what each value is: docs/SETUP-INPUTS.md
#
# Each key below becomes one file on the server (written by the playbook with
# the right modes - secrets/ folder 700, files 644, .env 600). Placeholder
# values (CHANGE-ME, PUT-...-HERE, change-me-now) are refused at deploy time.

# --- Firewall (CIDR lists) -------------------------------------------------
# Must include the address you deploy from, or the deploy stops (it would
# lock you out).
firewall_ssh_cidrs: [10.0.0.0/24]
firewall_engineer_cidrs: [10.0.0.0/24]   # Grafana, Prometheus, Alertmanager
firewall_noc_cidrs: []                   # Grafana only, e.g. [10.0.1.0/24]

# --- secrets/ (one file each) ---------------------------------------------
# -> secrets/grafana_admin_password.txt. Changing it later also resets the
#    live admin password on the next deploy.
grafana_admin_password: change-me-now

# -> secrets/telegram_bot_token.txt (@BotFather)
telegram_bot_token: PUT-TELEGRAM-BOT-TOKEN-HERE

# -> secrets/whatsapp_access_token.txt. The placeholder is fine while
#    whatsapp_mode is dry_run.
whatsapp_access_token: dry-run-placeholder

# -> secrets/deadman_url.txt (healthchecks.io ping URL, docs/deadman.md)
deadman_url: https://hc-ping.com/PUT-YOUR-CHECK-UUID-HERE

# -> secrets/routeros_api_credentials.json. JSON keyed by router `name`,
#    exactly the names in routeros_exporter_config below (checked at deploy).
routeros_api_credentials: |
  {
    "pop1-home": { "username": "prom-ro", "password": "CHANGE-ME" }
  }

# -> secrets/snmp_auths.yml. SNMPv3 users; paste the auths: block (template
#    and spelling rules: snmp_exporter/snmp_auths.example.yml, docs/snmpv3.md).
#    Remove entries you do not use rather than leaving CHANGE-ME values.
snmp_auths: |
  auths:
    mikrotik_v3:
      version: 3
      security_level: authPriv
      username: monitoring
      auth_protocol: SHA
      password: CHANGE-ME-auth-password
      priv_protocol: AES
      priv_password: CHANGE-ME-priv-password

# --- routeros_exporter/config.yml (non-secret, per site) ------------------
# Template: routeros_exporter/config.example.yml
routeros_exporter_config: |
  options:
    listen_port: 9436
    poll_interval_seconds: 30
    api_timeout_seconds: 30
    topology_interval_seconds: 900
    topology_output_path: /var/lib/routeros-exporter/topology.generated.yml
    log_lookback: 200
  routers:
    - name: pop1-home
      host: 192.168.10.1
      port: 8728
      site: HOME
      pop: HOME
      role: core-router

# --- .env: WhatsApp (optional; defaults in group_vars/all.yml) ------------
# whatsapp_mode: dry_run          # live = really send (costs money)
# whatsapp_phone_number_id: ""
# whatsapp_recipients: ""         # digits only, comma-separated
# whatsapp_daily_cap: 10
# whatsapp_monthly_cap: 100

