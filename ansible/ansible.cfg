# Used when ansible runs from this folder (scripts/deploy.sh and
# scripts/edit-secrets.sh both do). There is no default inventory: the site
# folder is passed with -i <site>/hosts.ini (deploy.sh --site). Docs: docs/ANSIBLE.md
[defaults]
# Prints the vault password from the macOS Keychain - never stored in a file.
vault_password_file = vault-pass.sh
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
