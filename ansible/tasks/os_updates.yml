- name: OS updates
  when: os_updates | bool
  block:
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true

    - name: Does Ubuntu want a reboot?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot (the stack comes back by itself - restart unless-stopped)
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: reboot_required.stat.exists
