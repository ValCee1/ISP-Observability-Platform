# The same checks as docs/GO-LIVE.md section E, but against staging with the
# real secrets mounted - run in a throwaway Compose project so the live
# containers are not touched. Any failure ends the deploy before apply.yml.
- name: Check staging
  vars:
    compose: [docker, compose, -p, "{{ preflight_project }}"]
  block:
    - name: docker compose config
      ansible.builtin.command:
        argv: "{{ compose + ['config', '-q'] }}"
        chdir: "{{ staging_dir }}"
      changed_when: false
      check_mode: false

    - name: Config checks with the real files
      ansible.builtin.command:
        argv: "{{ compose + ['run', '--rm', '--no-deps', '-T'] + item.args }}"
        chdir: "{{ staging_dir }}"
      changed_when: false
      check_mode: false
      loop:
        - name: promtool check config
          args: [--entrypoint, promtool, prometheus, check, config, /etc/prometheus/prometheus.yml]
        - name: amtool check-config
          args: [--entrypoint, amtool, alertmanager, check-config, /etc/alertmanager/alertmanager.yml]
        # catches SNMPv3 spellings (SHA1, AES-256) that stop snmp-exporter
        - name: snmp-exporter --dry-run with the SNMPv3 users
          args: [snmp-exporter, --config.file=/etc/snmp_exporter/snmp.yml, --config.file=/run/secrets/snmp_auths, --dry-run]
        - name: blackbox-exporter --config.check
          args: [blackbox-exporter, --config.file=/etc/blackbox_exporter/config.yml, --config.check]
      loop_control:
        label: "{{ item.name }}"

    # Downloads happen here, before anything live changes, with retries for
    # flaky links (a reset mid-pull otherwise fails `compose up` half-way).
    # Not in --check previews: it fills the server's image cache.
    - name: Pull the published images
      ansible.builtin.command:
        argv: "{{ compose + ['pull', '--quiet', '--ignore-buildable'] }}"
        chdir: "{{ staging_dir }}"
      register: compose_pull
      until: compose_pull.rc == 0
      retries: 4
      delay: 20
      changed_when: false
      when: not ansible_check_mode

    # Last: it re-tags the local images (isp-*:dev) that a later
    # `docker compose up` would pick up, so not in --check previews.
    - name: Build the bridge and exporter images
      ansible.builtin.command:
        argv: "{{ compose + ['build', '--quiet'] }}"
        chdir: "{{ staging_dir }}"
      register: compose_build
      until: compose_build.rc == 0
      retries: 2
      delay: 20
      changed_when: false
      when: not ansible_check_mode
  always:
    - name: Remove the throwaway project
      ansible.builtin.command:
        argv: "{{ compose + ['down', '--volumes', '--remove-orphans'] }}"
        chdir: "{{ staging_dir }}"
      changed_when: false
      check_mode: false
