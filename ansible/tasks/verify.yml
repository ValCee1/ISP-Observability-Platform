# Health after the release. A down scrape target is reported, not fatal: the
# device may really be down. Then the version is recorded on the server.
- name: Verify
  when: not ansible_check_mode
  block:
    - name: Every service running
      ansible.builtin.shell:
        cmd: >-
          diff <(docker compose config --services | sort)
          <(docker compose ps --status running --services | sort)
        executable: /bin/bash
        chdir: "{{ app_dir }}"
      register: running
      until: running.rc == 0
      retries: 10
      delay: 6
      changed_when: false

    - name: Prometheus, Alertmanager, Grafana healthy
      ansible.builtin.uri:
        url: "{{ item }}"
      register: health
      until: health.status == 200
      # up to 5 min, like `compose up --wait-timeout`: a first Grafana start
      # migrates its database and downloads the pinned Prometheus plugin
      retries: 100
      delay: 3
      loop:
        - http://127.0.0.1:9090/-/ready
        - http://127.0.0.1:9093/-/ready
        - http://127.0.0.1:3000/api/health

    - name: Prometheus loaded its config
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query?query=prometheus_config_last_reload_successful
      register: prom_reload
      until: (prom_reload.json.data.result | first).value[1] == "1"
      retries: 10
      delay: 3

    - name: Alertmanager loaded its config
      ansible.builtin.uri:
        url: http://127.0.0.1:9093/metrics
        return_content: true
      register: am_reload
      until: am_reload.content is search('(?m)^alertmanager_config_last_reload_successful 1$')
      retries: 10
      delay: 3

    # `up` right after a restart is the old exporter's last answer, or missing
    # for a new target, so the down list would be empty on every first
    # deploy. Wait until every active target has been scraped since now
    # (slowest job: 30 s interval + 25 s timeout); report, never fail.
    - name: Prometheus time now
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query?query=time()
      register: prom_now

    - name: Active scrape targets
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/targets?state=active
      register: active_targets

    - name: Every target scraped since the release
      ansible.builtin.uri:
        url: "http://127.0.0.1:9090/api/v1/query?query={{ ('count(timestamp(up) > ' ~ prom_now.json.data.result[1] ~ ')') | urlencode }}"
      register: scraped
      until: >-
        (scraped.json.data.result | length > 0) and
        (scraped.json.data.result[0].value[1] | int) >= (active_targets.json.data.activeTargets | length)
      retries: 24
      delay: 5
      failed_when: false

    - name: Remember whether they all were
      ansible.builtin.set_fact:
        all_scraped: >-
          {{ (scraped.json.data.result | length > 0) and
             (scraped.json.data.result[0].value[1] | int) >= (active_targets.json.data.activeTargets | length) }}

    - name: Scrape targets currently down
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query?query=up%3D%3D0
      register: down_targets

    - name: Down targets (check the device, its IP, SNMP user or firewall)
      ansible.builtin.debug:
        msg: "{{ down_targets.json.data.result | map(attribute='metric')
                 | map('dict2items') | map('selectattr', 'key', 'in', ['job', 'instance', 'router', 'link_id', 'sector'])
                 | map('items2dict') | list }}"
      when: down_targets.json.data.result | length > 0

    - name: Record the deployed version
      ansible.builtin.copy:
        content: |
          commit: {{ release_commit }}
          ref: {{ release_ref }}
          site: {{ isp_name }}
          site_commit: {{ site_commit or 'not a git repo' }}
          deployed: {{ ansible_facts['date_time']['iso8601'] }}
          by: {{ deployed_by }}
        dest: "{{ app_dir }}/DEPLOYED_VERSION"
        mode: "0644"

    - name: Append to the deploy history
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.deploy-history"
        line: "{{ ansible_facts['date_time']['iso8601'] }} {{ release_commit }} {{ release_ref }} {{ isp_name }}@{{ site_commit[:12] or '-' }} {{ deployed_by }}"
        create: true
        mode: "0644"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Deployed {{ release_ref }} ({{ release_commit[:12] }}) to {{ isp_name }}, site data {{ site_commit[:12] or 'not in git' }}"
          - "Changed files: {{ changed_paths | length }}"
          - "Reloaded: {{ (reload_services | difference(restart_services)) or 'none' }}"
          - "Restarted: {{ restart_services or 'none' }}"
          - "Down targets: {{ down_targets.json.data.result | length }}{{ '' if all_scraped | bool else ' (some targets not scraped yet - check /targets)' }}"
